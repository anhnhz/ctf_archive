<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Player</title>

<style nonce="{{ csp_nonce }}">

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#121212;
    color:white;

    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* NAVBAR */

nav{
    background:#1db954;
    padding:18px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav .links a{
    margin-left:25px;
}

a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    text-decoration:underline;
}

/* PAGE WRAPPER */

.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* FORM CONTAINER */

.container{
    max-width:520px;
    width:100%;
    background:#181818;
    padding:60px;
    border-radius:14px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

/* TITLE */

h2{
    text-align:center;
    margin-bottom:50px;
    font-size:28px;
}

/* FORM */

form{
    display:flex;
    flex-direction:column;
    gap:30px;
}

/* INPUT */

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:8px;
    background:#2a2a2a;
    color:white;
    font-size:15px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    background:#333;
}

/* BUTTON */

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:8px;
    background:#1db954;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#17a74a;
}

</style>
</head>

<body>

<nav>

<div>
<strong>Music Player</strong>
</div>

<div class="links">

<a href="{{ url_for('home') }}">Home</a>

{% if session.username %}

<a href="{{ url_for('dashboard') }}">Dashboard</a>
<a href="{{ url_for('add_song') }}">Add Song</a>
<a href="{{ url_for('report') }}">Report</a>
<a href="{{ url_for('logout') }}">Logout</a>

{% else %}

<a href="{{ url_for('login') }}">Login</a>
<a href="{{ url_for('register') }}">Register</a>

{% endif %}

</div>

</nav>

<div class="main">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
