{% extends "base.html" %}

{% block content %}

<h2>{{ song.title }}</h2>

<div style="display:flex; justify-content:center; margin-top:30px;">

<iframe 
    src="{{ song.spotify_url}}"
    width="400"
    height="380"
    frameborder="0"
    allowtransparency="true"
    allow="encrypted-media">
</iframe>

</div>

{% endblock %}
