<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #0f172a, #020617);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Navbar */
.navbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(8px);
    z-index: 1000;
}

.nav-left,
.nav-right {
    display: flex;
    gap: 20px;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #38bdf8;
    text-decoration: none;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: 0.2s;
}

.navbar a:hover {
    color: #38bdf8;
}

h1 {
    font-size: 60px;
    z-index: 2;
    margin: 0;
}

.username {
    color: #38bdf8;
}

/* confetti */
.confetti-container {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.left { left: 0; }
.right { right: 0; }

.confetti {
    position: absolute;
    width: 8px;
    height: 18px;
    animation: fall linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <div class="nav-left">
        <a href="/dashboard" class="logo">MyDashboard</a>
    </div>

    <div class="nav-right">
        <a href="/report">Report</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="confetti-container left" id="left"></div>
<div class="confetti-container right" id="right"></div>

<h1>Welcome <span class="username">{{ username | safe }}</span> 🎉</h1>

<script>
function spawnConfetti(containerId) {
    const container = document.getElementById(containerId);
    const colors = ['#38bdf8', '#22c55e', '#a78bfa', '#facc15'];

    for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.classList.add('confetti');

        el.style.left = Math.random() * 100 + 'px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (3 + Math.random() * 2) + 's';
        el.style.animationDelay = (Math.random() * 1) + 's';

        container.appendChild(el);

        setTimeout(() => el.remove(), 6000);
    }
}

window.onload = () => {
    spawnConfetti('left');
    spawnConfetti('right');
};
</script>

</body>
</html>
